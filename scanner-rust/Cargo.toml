[package]
name = "mev-scanner"
version = "0.1.0"
edition = "2021"
authors = ["IJack411"]
description = "High-performance MEV arbitrage scanner for the FlashLoanArbitrage contract"
license = "MIT"

[[bin]]
name = "mev-scanner"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Ethereum interaction
ethers = { version = "2", features = ["abigen", "ws", "rustls"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics (Prometheus)
prometheus = { version = "0.13", features = ["process"] }
axum = { version = "0.7", features = ["http2"] }

# Configuration
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Math / numeric
rust_decimal = { version = "1", features = ["serde-with-str"] }
num-traits = "0.2"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Hex / bytes
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
