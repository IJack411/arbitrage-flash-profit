type Token @entity {
  id: ID!
  address: String!
  symbol: String!
  decimals: Int!
}

type Pair @entity {
  id: ID!
  token0: Token!
  token1: Token!
  token0Price: BigDecimal!
  token1Price: BigDecimal!
  reserveUSD: BigDecimal!
  volumeUSD: BigDecimal!
  reserve0: BigDecimal!
  reserve1: BigDecimal!
  createdAtBlock: BigInt!
  createdAtTimestamp: BigInt!
}
